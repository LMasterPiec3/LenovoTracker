name: Build musl binary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (x86_64-unknown-linux-musl, pure-Rust deps → rust-lld)
        working-directory: rust-tracker
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Strip
        run: strip rust-tracker/target/x86_64-unknown-linux-musl/release/lenovo-tracker

      - name: Upload to release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (auto)
          files: rust-tracker/target/x86_64-unknown-linux-musl/release/lenovo-tracker
          make_latest: true
          body: |
            Automatischer musl-Build von `main` (Alpine-kompatibel).
            Download: `lenovo-tracker` — wird von lenovo-tracker-setup.sh automatisch genutzt.
