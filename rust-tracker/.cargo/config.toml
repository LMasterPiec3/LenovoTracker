# Build für den Alpine-Container (musl). Im Build-CT (build-base vorhanden)
# genügt rust-lld als Linker — lettre-TLS läuft über rustls, kein OpenSSL.
# Ein Cross-Build von Windows/macOS braucht dagegen x86_64-linux-musl-gcc,
# weil ring (rustls-Abhängigkeit) C und Assembler baut.
# Build:  cargo build --release --target x86_64-unknown-linux-musl
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
