[package]
name = "lenovo-tracker"
version = "1.0.0"
edition = "2021"
description = "Lenovo Clearance-Sale Mainboard-Tracker (Rust, minimal RAM)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
time = { version = "0.3", features = ["formatting"] }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "native-tls",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
